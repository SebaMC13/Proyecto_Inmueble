<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #4c8708;">
    <div class="container">

        <a class="navbar-brand fw-bold" href="{% url 'indice' %}">
            Arriendos Express
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'indice' %}">
                        Inicio
                    </a>
                </li>

                {% if user.is_authenticated %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'dashboard' %}">
                        Dashboard
                    </a>
                </li>
                {% endif %}

            </ul>

            {% if user.is_authenticated %}

            <span class="navbar-text me-3 text-dark">
                Hola, {{ request.user }}
            </span>

            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button class="btn btn-dark btn-sm">
                    Cerrar sesión
                </button>
            </form>

            {% else %}

            <a class="btn btn-dark btn-sm me-2" href="{% url 'login' %}">
                Iniciar sesión
            </a>

            <a class="btn btn-light btn-sm" href="{% url 'registro' %}">
                Registrarse
            </a>

            {% endif %}

        </div>
    </div>
</nav>
